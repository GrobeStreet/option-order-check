[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "option-order-check"
version = "0.1.0"
description = "Measure how much a multiple-choice LLM eval depends on answer-option order: accuracy with intervals, flip rate, accuracy by answer slot."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Robert Morong" }]
keywords = ["llm", "evaluation", "benchmark", "multiple-choice", "robustness", "option-order", "position-bias"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://robert-morong-research.netlify.app/free/"
Writeup = "https://robert-morong-research.netlify.app/writing/arc-option-order/"
Source = "https://github.com/GrobeStreet/robert-morong-research"

[project.scripts]
option-order-check = "option_order_check:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
option_order_check = ["demo.jsonl"]
